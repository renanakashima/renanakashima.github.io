{% if site.analytics.umami.website_id %}
<script
  defer
  src="{{ site.analytics.umami.script_url | default: 'https://cloud.umami.is/script.js' }}"
  data-website-id="{{ site.analytics.umami.website_id }}"
  {% if site.analytics.umami.domains %}data-domains="{{ site.analytics.umami.domains }}"{% endif %}
></script>
{% endif %}
